name: CI/CD pipeline

on:
  push:
    branches: [main, master, messaging]
  pull_request:
    branches: [main, master]
  
  jobs:
    test:
      name: Run tests and testcontainers
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:15-alpine
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: orderflow_test
          ports:
            - 5432: 5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        steps:
          - name: Checkout mode
            uses: actions/checkout@v4

          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: '1.25.7'
          - name: Install dependencies
            run: go mod download

          - name: Run tests with integration
            run: go test -v -race ./...
